name: Build and smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest exercises the "libsdl3-dev is available" fast path
        # (patches/0004); ubuntu-22.04 exercises the from-source SDL3
        # fallback (libsdl3-dev doesn't exist on 22.04's repos), so both
        # code paths setup.sh supports stay covered.
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        # Deliberately not fetching submodules here: scripts/setup.sh does
        # `git submodule update --init --recursive` itself, and that's the
        # actual documented user flow (README.md's "Setup" section) this
        # job exists to keep honest.

      - name: Run scripts/setup.sh
        run: ./scripts/setup.sh

      - name: Install Xvfb (for the headless smoke test only)
        run: sudo apt-get install -y -qq xvfb

      - name: Smoke test -- render each bundled example to a PNG
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-renders
          for f in cube cylinder triangle; do
            xvfb-run -a --server-args="-screen 0 800x600x24" \
              ./bin/3dpdf-view "third_party/nanoPRC/examples/$f.pdf" \
              --batch --output "/tmp/ci-renders/$f.png"
            test -s "/tmp/ci-renders/$f.png"
          done

      - name: Smoke test -- 3dpdf-view works from outside the repo (PATH symlink)
        run: |
          set -euo pipefail
          cd /tmp
          xvfb-run -a --server-args="-screen 0 800x600x24" \
            "$HOME/.local/bin/3dpdf-view" \
            "$GITHUB_WORKSPACE/third_party/nanoPRC/examples/cube.pdf" \
            --batch --output /tmp/ci-renders/from-path.png
          test -s /tmp/ci-renders/from-path.png

      - name: Upload rendered PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}
          path: /tmp/ci-renders/
          if-no-files-found: ignore

  build-deb:
    # Separate from the setup.sh matrix above: this builds and smoke-tests
    # scripts/build-deb.sh's actual output (a real .deb, installed via dpkg,
    # exercising the FHS-path fallback in bin/3dpdf-view -- not just the
    # git-checkout dev flow the job above covers), so a break in the
    # packaging path fails CI the same as a break in the source build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts/build-deb.sh
        run: ./scripts/build-deb.sh

      - name: Install the built .deb
        run: sudo dpkg -i dist/3dpdf-viewer_*_amd64.deb

      - name: Verify no libSDL3.so runtime dependency (this is the whole point of build-deb.sh forcing a static SDL3)
        run: |
          set -euo pipefail
          ! ldd /usr/lib/3dpdf-viewer/nano_prc_viewer | grep -qi sdl3

      - name: Install Xvfb (for the headless smoke test only)
        run: sudo apt-get install -y -qq xvfb

      - name: Smoke test -- installed package renders a bundled example
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-renders
          xvfb-run -a --server-args="-screen 0 800x600x24" \
            /usr/bin/3dpdf-view "third_party/nanoPRC/examples/cube.pdf" \
            --batch --output /tmp/ci-renders/deb-install.png
          test -s /tmp/ci-renders/deb-install.png

      - name: Smoke test -- graceful failure dialog on a non-3D PDF (no crash, clean exit)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq imagemagick zenity
          convert -size 100x100 xc:white /tmp/plain2d.pdf
          xvfb-run -a --server-args="-screen 0 800x600x24" \
            /usr/bin/3dpdf-view /tmp/plain2d.pdf > /tmp/fail-output.log 2>&1 &
          PID=$!
          sleep 3
          kill -9 "$PID" 2>/dev/null || true
          pkill -9 zenity 2>/dev/null || true
          grep -q "failed to open" /tmp/fail-output.log

      - name: Upload the .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3dpdf-viewer-deb
          path: dist/*.deb
          if-no-files-found: ignore
